name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nama aplikasi (tanpa tanda kutip)"
        required: true
        default: "COT Runner"
      app_url:
        description: "Link web yang ditampilkan"
        required: true
        default: "https://example.com"
      app_id:
        description: "ID unik: huruf kecil, tanpa spasi (contoh: com.ginan.app2)"
        required: true
        default: "com.ginan.cotrunner"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        env:
          APP_NAME: ${{ inputs.app_name }}
          APP_URL: ${{ inputs.app_url }}
          APP_ID: ${{ inputs.app_id }}
        run: gradle assembleDebug --no-daemon -PappName="$APP_NAME" -PappUrl="$APP_URL" -PappId="$APP_ID"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_id }}-apk
          path: app/build/outputs/apk/debug/*.apk
